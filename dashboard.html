<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Obras Públicas - Control Municipal</title>
    <style>
        :root {
            --vino-morena: #561124;
            --bg-gris: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-gris); color: #333; }
        
        header { background: var(--vino-morena); color: #ffffff; padding: 22px; text-align: center; font-size: 1.5rem; font-weight: bold; letter-spacing: -0.3px; text-transform: uppercase; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        
        .nav-container { max-width: 1200px; margin: 15px auto 0; padding: 0 20px; }
        .back { display: inline-flex; align-items: center; gap: 8px; color: var(--vino-morena); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
        /* Corrección del icono roto: Usamos un SVG nativo embebido en el CSS */
        .back-icon { width: 18px; height: 18px; fill: var(--vino-morena); }

        .kpi-container { max-width: 1200px; margin: 15px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .kpi-card { background: white; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border-top: 4px solid var(--vino-morena); text-align: center; }
        .kpi-card h4 { font-size: 0.9rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .kpi-card .num { font-size: 1.8rem; font-weight: bold; color: var(--vino-morena); }

        .main-layout { max-width: 1200px; margin: 10px auto 50px; padding: 20px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
        .panel-lista { max-height: 550px; overflow-y: auto; padding-right: 5px; }
        
        #mapa-vectorial { 
            height: 550px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            border: 2px solid var(--vino-morena); 
            background: #e5e9f0;
            position: relative;
            overflow: hidden;
        }
        .v-grid { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(#d8dee9 1px, transparent 1px), linear-gradient(90deg, #d8dee9 1px, transparent 1px); background-size: 40px 40px; }
        .calle-linea { stroke-width: 6; stroke-linecap: round; opacity: 0.85; }
        
        .box { background: white; padding: 18px; margin-bottom: 12px; border-left: 6px solid var(--vino-morena); border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
        
        .tag { padding: 4px 10px; border-radius: 4px; color: white; font-weight: bold; font-size: 10px; text-transform: uppercase; display: inline-block; }
        .PENDIENTE { background: var(--vino-morena); } .REPARADO { background: #28a745; }
        
        .info { font-size: 0.9rem; color: #555; }
        .assignment { font-size: 0.9rem; font-weight: bold; color: var(--vino-morena); margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            #mapa-vectorial { height: 350px; }
        }
    </style>
</head>
<body>
    <header>DIRECCIÓN DE OBRAS PÚBLICAS - AUDITORÍA VIAL INTEGRAL</header>
    
    <div class="nav-container">
        <a href="/index.html" class="back">
            <svg class="back-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Volver al Hub Central
        </a>
    </div>

    <div class="kpi-container">
        <div class="kpi-card"><h4>Alertas Críticas</h4><div class="num" id="kpi-criticos">0</div></div>
        <div class="kpi-card"><h4>Reportes Pendientes</h4><div class="num" id="kpi-pendientes">0</div></div>
        <div class="kpi-card"><h4>Vialidades Solucionadas</h4><div class="num" style="color:#28a745;" id="kpi-reparados">0</div></div>
        <div class="kpi-card"><h4>Eficiencia Municipal</h4><div class="num" style="color:#dfb15b;" id="kpi-eficiencia">0%</div></div>
    </div>
    
    <div class="main-layout">
        <div class="panel-lista" id="v">
            <div style="text-align:center; color:#666; padding-top:20px;">Estabilizando conexión de datos abiertos...</div>
        </div>
        <div id="mapa-vectorial">
            <div class="v-grid"></div>
            <svg id="svg-vial" width="100%" height="100%" style="position:absolute; top:0; left:0;"></svg>
        </div>
    </div>
    
    <script>
        async function up(){
            try {
                const r = await fetch('/api/supervision/mapa');
                if (!r.ok) throw new Error('Error de base de datos');
                const d = await r.json();
                
                let pendientes = d.filter(b => b.estado === 'PENDIENTE').length;
                let reparados = d.filter(b => b.estado === 'REPARADO').length;
                let criticos = d.filter(b => b.gravedad === 'CRÍTICO').length;
                let eficiencia = d.length ? Math.round((reparados / d.length) * 100) : 0;

                document.getElementById('kpi-pendientes').innerText = pendientes;
                document.getElementById('kpi-reparados').innerText = reparados;
                document.getElementById('kpi-criticos').innerText = criticos;
                document.getElementById('kpi-eficiencia').innerText = eficiencia + "%";

                const svg = document.getElementById('svg-vial');
                svg.innerHTML = ''; 

                if(d.length === 0) {
                    document.getElementById('v').innerHTML = "<div style='text-align:center; color:#777; padding-top:20px;'>Jurisdicción limpia. No hay reportes de baches registrados hoy.</div>";
                    return;
                }

                d.forEach((b, index) => {
                    let colorCalle = b.estado === 'PENDIENTE' ? (b.impactos_detectados >= 5 ? '#561124' : '#ffc107') : '#28a745';
                    const yPos = 50 + (index * 60) % 450;
                    
                    const linea = document.createElementNS("http://w3.org", "line");
                    linea.setAttribute("x1", "20"); linea.setAttribute("y1", yPos);
                    linea.setAttribute("x2", "90%"); linea.setAttribute("y2", yPos);
                    linea.setAttribute("class", "calle-linea"); linea.setAttribute("stroke", colorCalle);
                    svg.appendChild(linea);

                    const circulo = document.createElementNS("http://w3.org", "circle");
                    circulo.setAttribute("cx", "50%"); circulo.setAttribute("cy", yPos);
                    circulo.setAttribute("r", "8"); circulo.setAttribute("fill", colorCalle);
                    circulo.setAttribute("stroke", "#ffffff"); circulo.setAttribute("stroke-width", "2");
                    svg.appendChild(circulo);
                });

                document.getElementById('v').innerHTML = d.map(b => `
                    <div class='box'>
                        <div>
                            <span class='tag ${b.estado}'>${b.estado}</span> 
                            <strong style="margin-left:5px;">Reporte #${b.id}</strong> (${b.gravedad})
                        </div>
                        <div class='info'>📍 Ubicación: ${b.latitud}, ${b.longitud}<br>Validaciones: <strong>${b.impactos_detectados} vehículos</strong></div>
                        <div class='assignment'>👷 Empresa responsable: ${b.empresa_asignada}</div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('v').innerHTML = "<div style='text-align:center; color:#561124; font-weight:bold; padding-top:20px;'>⚠️ Esperando inicialización. Ejecuta la ruta /api/db/init en otra pestaña.</div>";
            }
        }
        setInterval(up, 3000); up();
    </script>
</body>
</html>
