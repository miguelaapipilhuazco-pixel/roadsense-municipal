<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrillas en Campo</title>
    <style>
        :root { --vino-morena: #561124; }
        body{font-family:sans-serif;margin:0;background:#f8f9fa}
        header{background:var(--vino-morena);color:#ffffff;padding:15px;text-align:center;font-size:20px;font-weight:bold}
        .select-box{text-align:center;margin:20px}
        select{padding:10px 15px;font-size:16px;border:2px solid var(--vino-morena);border-radius:4px;color:var(--vino-morena);font-weight:bold}
        .container{max-width:500px;margin:auto;padding:10px}
        .box{background:white;padding:15px;margin-bottom:15px;border-radius:4px;border-left:8px solid var(--vino-morena);box-shadow:0 3px 6px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center}
        .btn{background:var(--vino-morena);color:#ffffff;border:none;padding:10px 15px;cursor:pointer;font-weight:bold;border-radius:4px}
        .back{display:inline-flex;align-items:center;gap:6px;margin:15px;color:var(--vino-morena);text-decoration:none;font-weight:bold}
        .back-icon { width:16px; height:16px; filter: invert(12%) sepia(31%) saturate(4649%) hue-rotate(325deg) brightness(87%) contrast(92%); }
    </style>
</head>
<body>
    <header>👷 CUADRILLAS EN CAMPO - TELEMETRÍA VIAL</header>
    <a href="/index.html" class="back">
        <img src="https://icons8.com" class="back-icon" alt="Volver">
        Volver al Hub Central
    </a>
    <div class="select-box">
        <select id="s" onchange="up()">
            <option value="Cuadrilla Sector Norte">Sector Norte</option>
            <option value="Cuadrilla Sector Sur">Sector Sur</option>
        </select>
    </div>
    <div class="container" id="v"></div>
    <script>
        async function rep(id){
            await fetch('/api/contratista/reparar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
            up();
        }
        async function up(){
            const s = document.getElementById('s').value;
            const r = await fetch('/api/contratista/' + encodeURIComponent(s));
            const d = await r.json();
            document.getElementById('v').innerHTML = d.map(b => `
                <div class='box'>
                    <div><strong>Bache #${b.id}</strong> (${b.gravedad})<div style="font-size:13px;color:#666;margin-top:3px;">📍 ${b.latitud}, ${b.longitud}</div></div>
                    <button class='btn' onclick='rep(${b.id})'>Tapar Bache</button>
                </div>
            `).join('');
        }
        setInterval(up,3000); up();
    </script>
</body>
</html>
